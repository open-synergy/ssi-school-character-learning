scenarios:
  - name: "Character Observation Operating Unit - Default from user's operating unit"
    steps:
      - step: "Setup - create partner for Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou_a_partner"
        values:
          name: "Character Evidence Observation Operating Unit A Partner"

      - step: "Setup - create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "Character Evidence Observation Operating Unit A"
          code: "OUCEVOBSA"
          company_id: "REF: base.main_company"
          partner_id: "EVAL: registry['ou_a_partner'].id"

      # NOTE: base.group_user is required here -- without it, even basic ORM
      # operations (e.g. the internal ir.model lookups triggered while
      # creating a school_character_observation) raise AccessError, since a
      # large part of Odoo's base system models are only readable by internal
      # users. This does mean the pre-existing company-wide ir.rule from the
      # base module (scoped to base.group_user) also applies to this user and
      # is OR-combined with the new Operating Unit rule -- that is expected
      # Odoo ir.rule behavior (group-scoped rules combine via OR). This
      # scenario only checks that operating_unit_id defaults correctly from
      # the creating user; it does not depend on row-level isolation.
      - step: "Setup - create user restricted to Operating Unit A"
        action: "create"
        model: "res.users"
        save_as: "user_ou_a"
        values:
          name: "Character Evidence Observation User OU-A"
          login: "test_character_evidence_observation_ou_a@ssi-school.test"
          company_id: "REF: base.main_company"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF:
                  ssi_school_character_evidence.school_character_observation_user_group"
                - "REF:
                  ssi_school_character_evidence_operating_unit.school_character_observation_operating_unit_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "EVAL: registry['ou_a'].id"
          default_operating_unit_id: "EVAL: registry['ou_a'].id"

      - step: "Setup - create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Character Evidence OU Construct A"
          code: "CEVOU-CON-A"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Character Evidence OU Grade Type A"
          code: "CEVOU-GT-A"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "Character Evidence OU School A"
          code: "CEVOU-SCH-A"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Character Evidence OU Student A Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Character Evidence OU Student A"
          code: "CEVOU-STU-A"
          contact_id: "EVAL: registry['student_contact'].id"
          school_id: "EVAL: registry['school'].id"

      # The odoo-yaml-test framework's own "as_user" step key only accepts an
      # XML ID resolvable via env.ref(), so it cannot address a res.users
      # record created earlier in this same scenario (it has no XML ID).
      # `with_user()` is used instead, inside an EVAL domain leaf, to run the
      # actual create() call as that specific user -- this is what makes
      # mixin.single_operating_unit's own default resolve against *that*
      # user's default_operating_unit_id, exactly as it would in the real app.
      # The surrounding "search" action then confirms both that the created
      # record exists and that its operating_unit_id matches Operating Unit A
      # in the same step.
      - step:
          "Create observation as Operating Unit A user (operating_unit_id must default
          from that user)"
        action: "search"
        model: "school_character_observation"
        domain:
          - - "id"
            - "="
            - >-
              EVAL:
              env['school_character_observation'].with_user(registry['user_ou_a']).create({
              'date': date(2026, 9, 30), 'student_id': registry['student'].id,
              'construct_id': registry['construct'].id }).id
          - ["operating_unit_id", "=", "EVAL: registry['ou_a'].id"]
        save_as: "observation"
        expect_count: 1

      - step: "Assert observation created in draft"
        action: "assert"
        target: "observation"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step:
          "Assert the Operating Unit ir.rule for school_character_observation is wired
          correctly"
        action: "search"
        model: "ir.rule"
        save_as: "observation_ou_rule_check"
        domain:
          - [
              "id",
              "=",
              "REF:
              ssi_school_character_evidence_operating_unit.school_character_observation_ou",
            ]
          - [
              "domain_force",
              "=",
              "[('operating_unit_id','in',[g.id for g in user.operating_unit_ids])]",
            ]
          - [
              "groups",
              "in",
              "REF:
              ssi_school_character_evidence_operating_unit.school_character_observation_operating_unit_group",
            ]
        expect_count: 1

  - name: "Character Calibration Operating Unit - Default from user's operating unit"
    steps:
      - step: "Setup - create partner for Operating Unit B"
        action: "create"
        model: "res.partner"
        save_as: "ou_b_partner"
        values:
          name: "Character Evidence Calibration Operating Unit B Partner"

      - step: "Setup - create Operating Unit B"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "Character Evidence Calibration Operating Unit B"
          code: "OUCEVCALB"
          company_id: "REF: base.main_company"
          partner_id: "EVAL: registry['ou_b_partner'].id"

      # base.group_user is required for basic ORM functionality (see note in
      # the previous scenario). This scenario verifies what the OU glue module
      # is responsible for on the calibration model: operating_unit_id
      # defaults correctly from the creating user, and the new ir.rule record
      # is wired with the expected domain and shared OU group.
      - step: "Setup - create user restricted to Operating Unit B"
        action: "create"
        model: "res.users"
        save_as: "user_ou_b"
        values:
          name: "Character Evidence Calibration User OU-B"
          login: "test_character_evidence_calibration_ou_b@ssi-school.test"
          company_id: "REF: base.main_company"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF:
                  ssi_school_character_evidence.school_character_calibration_user_group"
                - "REF:
                  ssi_school_character_evidence_operating_unit.school_character_observation_operating_unit_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "EVAL: registry['ou_b'].id"
          default_operating_unit_id: "EVAL: registry['ou_b'].id"

      - step:
          "Create calibration as Operating Unit B user (operating_unit_id must default
          from that user)"
        action: "search"
        model: "school_character_calibration"
        domain:
          - - "id"
            - "="
            - >-
              EVAL:
              env['school_character_calibration'].with_user(registry['user_ou_b']).create({
              'date': date(2026, 9, 30) }).id
          - ["operating_unit_id", "=", "EVAL: registry['ou_b'].id"]
        save_as: "calibration"
        expect_count: 1

      - step: "Assert calibration created in draft"
        action: "assert"
        target: "calibration"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step:
          "Assert the Operating Unit ir.rule for school_character_calibration is wired
          correctly"
        action: "search"
        model: "ir.rule"
        save_as: "calibration_ou_rule_check"
        domain:
          - [
              "id",
              "=",
              "REF:
              ssi_school_character_evidence_operating_unit.school_character_calibration_ou",
            ]
          - [
              "domain_force",
              "=",
              "[('operating_unit_id','in',[g.id for g in user.operating_unit_ids])]",
            ]
          - [
              "groups",
              "in",
              "REF:
              ssi_school_character_evidence_operating_unit.school_character_observation_operating_unit_group",
            ]
        expect_count: 1
