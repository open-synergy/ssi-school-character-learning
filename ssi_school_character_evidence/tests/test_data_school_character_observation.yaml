scenarios:
  - name: "Observation Full Workflow With Three Evidence Entries"
    steps:
      - step: "Setup - create character profile"
        action: "create"
        model: "school_character_profile"
        save_as: "profile"
        values:
          name: "Observation Profile A"
          code: "OBS-PROF-A"

      - step: "Setup - create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Integrity Obs A"
          code: "OBS-CON-A"
          profile_id: "REC: profile.id"

      - step: "Setup - create sub-construct"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "subconstruct"
        values:
          name: "Honesty Obs A"
          code: "OBS-SUB-A"
          construct_id: "REC: construct.id"

      - step: "Setup - create scale"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "Obs Scale A"
          code: "OBS-SCL-A"

      - step: "Setup - create lower level"
        action: "create"
        model: "school_character_level"
        save_as: "level_low"
        values:
          name: "Developing Obs A"
          code: "OBS-LVL-A1"
          scale_id: "REC: scale.id"
          sequence: 10

      - step: "Setup - create higher level"
        action: "create"
        model: "school_character_level"
        save_as: "level_high"
        values:
          name: "Consistent Obs A"
          code: "OBS-LVL-A2"
          scale_id: "REC: scale.id"
          sequence: 20

      - step: "Setup - create arena"
        action: "create"
        model: "school_character_arena"
        save_as: "arena"
        values:
          name: "Classroom Obs A"
          code: "OBS-ARENA-A"

      - step: "Setup - create indicator on the construct"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator"
        values:
          name: "Admit Mistake Obs A"
          code: "OBS-IND-A"
          construct_id: "REC: construct.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Obs A"
          code: "OBS-GT-A"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Obs A"
          code: "OBS-SCH-A"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Observation Student Contact A"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Obs A"
          code: "OBS-STU-A"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Academic Year Obs A"
          code: "OBS-AY-A"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Academic Term Obs A"
          code: "OBS-AT-A"
          year_id: "REC: academic_year.id"
          date_start: 2026-07-01
          date_end: 2026-12-31

      - step: "Setup - create observer employee"
        action: "create"
        model: "hr.employee"
        save_as: "observer_employee"
        values:
          name: "Observer Employee A"

      - step: "Setup - create observer teacher"
        action: "create"
        model: "school_teacher"
        save_as: "observer"
        values:
          name: "Observer Teacher A"
          code: "OBS-TCH-A"
          employee_id: "REC: observer_employee.id"

      - step: "Create observation with three evidence entries"
        action: "create"
        model: "school_character_observation"
        save_as: "observation"
        values:
          date: 2026-09-30
          student_id: "REC: student.id"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: subconstruct.id"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          provisional_level_id: "REC: level_high.id"
          summary: "Consistent honest self-reporting across the term."
          evidence_ids:
            - - 0
              - 0
              - date: 2026-08-15
                arena_id: "REC: arena.id"
                indicator_id: "REC: indicator.id"
                observer_id: "REC: observer.id"
                context: "Group work feedback session."
                observed_behavior: "Openly acknowledged an error and corrected it."
                source_type: "observation"
                evidence_quality: "strong"
                matched_level_id: "REC: level_high.id"
            - - 0
              - 0
              - date: 2026-09-01
                arena_id: "REC: arena.id"
                observer_id: "REC: observer.id"
                context: "End-of-project self reflection."
                observed_behavior: "Reflected on choosing to report a mistake."
                source_type: "reflection"
                evidence_quality: "good"
                matched_level_id: "REC: level_low.id"
            - - 0
              - 0
              - date: 2026-09-20
                arena_id: "REC: arena.id"
                observer_id: "REC: observer.id"
                context: "Project progress log review."
                observed_behavior: "Progress log transparently recorded a failure."
                source_type: "artifact"
                evidence_quality: "sufficient"
                matched_level_id: "REC: level_high.id"

      - step: "Assert observation created in draft with three evidence entries"
        action: "assert"
        target: "observation"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          student_id:
            type: "m2o"
            expected: "REC: student"
          construct_id:
            type: "m2o"
            expected: "REC: construct"
          evidence_ids:
            type: "o2m"
            check: "count"
            expected_count: 3
          evidence_count:
            type: "value"
            expected: 3

      - step: "Fetch the reflection evidence entry"
        action: "search"
        model: "school_character_observation.evidence"
        domain:
          - ["observation_id", "=", "REC: observation.id"]
          - ["source_type", "=", "reflection"]
        save_as: "reflection_entry"
        expect_count: 1

      - step: "Assert reflection entry recorded as a reflection source"
        action: "assert"
        target: "reflection_entry"
        asserts:
          source_type:
            type: "value"
            expected: "reflection"
          evidence_quality:
            type: "value"
            expected: "good"
          matched_level_id:
            type: "m2o"
            expected: "REC: level_low"

      - step: "Confirm observation"
        action: "call"
        target: "observation"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate observation cache before approve"
        action: "call"
        target: "observation"
        method: "invalidate_cache"

      - step: "Approve observation"
        action: "call"
        target: "observation"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert document number generated with OBS prefix"
        action: "assert"
        target: "observation"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "OBS"

      - step: "Invalidate observation cache before done"
        action: "call"
        target: "observation"
        method: "invalidate_cache"

      - step: "Done observation"
        action: "call"
        target: "observation"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Observation Records Invalid Evidence And Has No Discipline Relation"
    steps:
      - step: "Setup - create character profile"
        action: "create"
        model: "school_character_profile"
        save_as: "profile"
        values:
          name: "Observation Profile B"
          code: "OBS-PROF-B"

      - step: "Setup - create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Integrity Obs B"
          code: "OBS-CON-B"
          profile_id: "REC: profile.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Obs B"
          code: "OBS-GT-B"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Obs B"
          code: "OBS-SCH-B"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Observation Student Contact B"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Obs B"
          code: "OBS-STU-B"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Create observation with one invalid evidence entry"
        action: "create"
        model: "school_character_observation"
        save_as: "observation"
        values:
          date: 2026-09-30
          student_id: "REC: student.id"
          construct_id: "REC: construct.id"
          summary: "Documents an inadmissible source for governance."
          evidence_ids:
            - - 0
              - 0
              - date: 2026-08-10
                context: "Hallway rumor reported by another student."
                observed_behavior: "Second-hand hearsay, not directly observed."
                source_type: "observation"
                evidence_quality: "invalid"

      - step: "Assert observation saved in draft with one evidence entry"
        action: "assert"
        target: "observation"
        asserts:
          state:
            type: "value"
            expected: "draft"
          evidence_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Fetch the invalid evidence entry"
        action: "search"
        model: "school_character_observation.evidence"
        domain:
          - ["observation_id", "=", "REC: observation.id"]
        save_as: "invalid_entry"
        expect_count: 1

      - step: "Assert the invalid tier is recorded but not admissible"
        action: "assert"
        target: "invalid_entry"
        asserts:
          evidence_quality:
            type: "value"
            expected: "invalid"

      - step: "Data governance - no discipline/incident relation exists on evidence"
        action: "create"
        model: "school_character_observation.evidence"
        expect_error:
          type: "ValueError"
        values:
          observation_id: "REC: observation.id"
          date: 2026-08-11
          incident_id: 1

      - step: "Data governance - no counseling relation exists on evidence"
        action: "create"
        model: "school_character_observation.evidence"
        expect_error:
          type: "ValueError"
        values:
          observation_id: "REC: observation.id"
          date: 2026-08-12
          counseling_id: 1
