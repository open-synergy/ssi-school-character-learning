scenarios:
  - name: "Configurator member can create, write and unlink a Character Rubric"
    steps:
      - step: "Create the Character Rubric Configurator user"
        action: "create"
        model: "res.users"
        save_as: "configurator"
        values:
          name: "Character Rubric Configurator"
          login: "character_rubric_configurator@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_rubric_group",
                ],
              ],
            ]
      - step: "Create the scale fixture as superuser"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "ACL Rubric Scale"
          code: "ACL-RUB-SCALE-P"
      - step: "Create the level fixture as superuser"
        action: "create"
        model: "school_character_level"
        save_as: "level"
        values:
          name: "ACL Rubric Level"
          code: "ACL-RUB-LVL-P"
          scale_id: "REC: scale.id"
          sequence: 10
      - step: "Create the construct fixture as superuser"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Rubric Construct"
          code: "ACL-RUB-CON-P"
      - step: "Create as the configurator group member must succeed"
        action: "create"
        model: "school_character_rubric"
        as_user: "configurator"
        save_as: "record"
        values:
          name: "Configurator Rubric"
          code: "ACL-RUB-POS"
          construct_id: "REC: construct.id"
          scale_id: "REC: scale.id"
          descriptor_ids:
            - - 0
              - 0
              - level_id: "REC: level.id"
                descriptor: "ACL descriptor."
      - step: "Assert the inline descriptor was created"
        action: "assert"
        target: "record"
        asserts:
          descriptor_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
      - step: "Write as the configurator group member must succeed"
        action: "write"
        target: "record"
        as_user: "configurator"
        values:
          name: "Configurator Rubric Updated"
      - step: "Assert the write persisted"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Configurator Rubric Updated"
      - step: "Unlink as the configurator group member must succeed"
        action: "unlink"
        target: "record"
        as_user: "configurator"
      - step: "Assert the record is gone"
        action: "search"
        model: "school_character_rubric"
        domain: [["code", "=", "ACL-RUB-POS"]]
        save_as: "gone"
        expect_count: 0

  - name: "Workflow User group alone cannot create, write or unlink a Character Rubric"
    steps:
      - step: "Create the Character Rubric Workflow User user"
        action: "create"
        model: "res.users"
        save_as: "workflow_user"
        values:
          name: "Character Rubric Workflow User"
          login: "character_rubric_workflow_user@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_user_group",
                ],
              ],
            ]
      - step: "Create the scale fixture as superuser"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "ACL Rubric Scale"
          code: "ACL-RUB-SCALE-N"
      - step: "Create the level fixture as superuser"
        action: "create"
        model: "school_character_level"
        save_as: "level"
        values:
          name: "ACL Rubric Level"
          code: "ACL-RUB-LVL-N"
          scale_id: "REC: scale.id"
          sequence: 10
      - step: "Create the construct fixture as superuser"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Rubric Construct"
          code: "ACL-RUB-CON-N"
      - step: "Create the fixture record as superuser"
        action: "create"
        model: "school_character_rubric"
        save_as: "fixture"
        values:
          name: "Fixture Rubric"
          code: "ACL-RUB-NEG"
          construct_id: "REC: construct.id"
          scale_id: "REC: scale.id"
      - step: "Create as the workflow User group member must be rejected"
        action: "create"
        model: "school_character_rubric"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rubric"
          code: "ACL-RUB-BLK"
          construct_id: "REC: construct.id"
          scale_id: "REC: scale.id"
          descriptor_ids:
            - - 0
              - 0
              - level_id: "REC: level.id"
                descriptor: "ACL descriptor."
      - step: "Write as the workflow User group member must be rejected"
        action: "write"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rename"
      - step: "Unlink as the workflow User group member must be rejected"
        action: "unlink"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
      - step: "Read as the workflow User group member still works"
        action: "search"
        model: "school_character_rubric"
        as_user: "workflow_user"
        domain: [["id", "=", "REC: fixture.id"]]
        save_as: "visible"
        expect_count: 1
