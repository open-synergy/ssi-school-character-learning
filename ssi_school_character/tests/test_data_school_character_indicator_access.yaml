scenarios:
  - name: "Configurator member can create, write and unlink a Character Indicator"
    steps:
      - step: "Create the parent construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Construct IND1"
          code: "ACL-CONSTRUCT-IND1"
      - step: "Create the Character Indicator Configurator user"
        action: "create"
        model: "res.users"
        save_as: "configurator"
        values:
          name: "Character Indicator Configurator"
          login: "character_indicator_configurator@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_indicator_group",
                ],
              ],
            ]
      - step: "Create as the configurator group member must succeed"
        action: "create"
        model: "school_character_indicator"
        as_user: "configurator"
        save_as: "record"
        values:
          name: "Configurator Indicator"
          code: "ACL-IND-POS"
          construct_id: "REC: construct.id"
      - step: "Write as the configurator group member must succeed"
        action: "write"
        target: "record"
        as_user: "configurator"
        values:
          name: "Configurator Indicator Updated"
      - step: "Assert the write persisted"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Configurator Indicator Updated"
      - step: "Unlink as the configurator group member must succeed"
        action: "unlink"
        target: "record"
        as_user: "configurator"
      - step: "Assert the record is gone"
        action: "search"
        model: "school_character_indicator"
        domain: [["code", "=", "ACL-IND-POS"]]
        save_as: "gone"
        expect_count: 0

  - name:
      "Workflow User group alone cannot create, write or unlink a Character Indicator"
    steps:
      - step: "Create the parent construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Construct IND2"
          code: "ACL-CONSTRUCT-IND2"
      - step: "Create the Character Indicator Workflow User user"
        action: "create"
        model: "res.users"
        save_as: "workflow_user"
        values:
          name: "Character Indicator Workflow User"
          login: "character_indicator_workflow_user@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_user_group",
                ],
              ],
            ]
      - step: "Create the fixture record as superuser"
        action: "create"
        model: "school_character_indicator"
        save_as: "fixture"
        values:
          name: "Fixture Indicator"
          code: "ACL-IND-NEG"
          construct_id: "REC: construct.id"
      - step: "Create as the workflow User group member must be rejected"
        action: "create"
        model: "school_character_indicator"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Indicator"
          code: "ACL-IND-BLK"
          construct_id: "REC: construct.id"
      - step: "Write as the workflow User group member must be rejected"
        action: "write"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rename"
      - step: "Unlink as the workflow User group member must be rejected"
        action: "unlink"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
      - step: "Read as the workflow User group member still works"
        action: "search"
        model: "school_character_indicator"
        as_user: "workflow_user"
        domain: [["id", "=", "REC: fixture.id"]]
        save_as: "visible"
        expect_count: 1
