scenarios:
  - name: "Configurator member can create, write and unlink a Character Level"
    steps:
      - step: "Create the parent scale"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "ACL Scale LVLA1"
          code: "ACL-SCALE-LVLA1"
      - step: "Create the Character Level Configurator user"
        action: "create"
        model: "res.users"
        save_as: "configurator"
        values:
          name: "Character Level Configurator"
          login: "character_level_configurator@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_level_group",
                ],
              ],
            ]
      - step: "Create as the configurator group member must succeed"
        action: "create"
        model: "school_character_level"
        as_user: "configurator"
        save_as: "record"
        values:
          name: "Configurator Level"
          code: "ACL-LVLA-POS"
          scale_id: "REC: scale.id"
      - step: "Write as the configurator group member must succeed"
        action: "write"
        target: "record"
        as_user: "configurator"
        values:
          name: "Configurator Level Updated"
      - step: "Assert the write persisted"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Configurator Level Updated"
      - step: "Unlink as the configurator group member must succeed"
        action: "unlink"
        target: "record"
        as_user: "configurator"
      - step: "Assert the record is gone"
        action: "search"
        model: "school_character_level"
        domain: [["code", "=", "ACL-LVLA-POS"]]
        save_as: "gone"
        expect_count: 0

  - name: "Workflow User group alone cannot create, write or unlink a Character Level"
    steps:
      - step: "Create the parent scale"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "ACL Scale LVLA2"
          code: "ACL-SCALE-LVLA2"
      - step: "Create the Character Level Workflow User user"
        action: "create"
        model: "res.users"
        save_as: "workflow_user"
        values:
          name: "Character Level Workflow User"
          login: "character_level_workflow_user@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_user_group",
                ],
              ],
            ]
      - step: "Create the fixture record as superuser"
        action: "create"
        model: "school_character_level"
        save_as: "fixture"
        values:
          name: "Fixture Level"
          code: "ACL-LVLA-NEG"
          scale_id: "REC: scale.id"
      - step: "Create as the workflow User group member must be rejected"
        action: "create"
        model: "school_character_level"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Level"
          code: "ACL-LVLA-BLK"
          scale_id: "REC: scale.id"
      - step: "Write as the workflow User group member must be rejected"
        action: "write"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rename"
      - step: "Unlink as the workflow User group member must be rejected"
        action: "unlink"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
      - step: "Read as the workflow User group member still works"
        action: "search"
        model: "school_character_level"
        as_user: "workflow_user"
        domain: [["id", "=", "REC: fixture.id"]]
        save_as: "visible"
        expect_count: 1
