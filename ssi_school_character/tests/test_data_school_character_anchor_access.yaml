scenarios:
  - name: "Configurator member can create, write and unlink a Character Anchor"
    steps:
      - step: "Create the scale"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "ACL Scale ANC1"
          code: "ACL-SCALE-ANC1"
      - step: "Create the level"
        action: "create"
        model: "school_character_level"
        save_as: "level"
        values:
          name: "ACL Level ANC1"
          code: "ACL-LVL-ANC1"
          scale_id: "REC: scale.id"
          sequence: 10
      - step: "Create the construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Construct ANC1"
          code: "ACL-CON-ANC1"
      - step: "Create the Character Anchor Configurator user"
        action: "create"
        model: "res.users"
        save_as: "configurator"
        values:
          name: "Character Anchor Configurator"
          login: "character_anchor_configurator@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_anchor_group",
                ],
              ],
            ]
      - step: "Create as the configurator group member must succeed"
        action: "create"
        model: "school_character_anchor"
        as_user: "configurator"
        save_as: "record"
        values:
          name: "Configurator Anchor"
          code: "ACL-ANC-POS"
          construct_id: "REC: construct.id"
          level_id: "REC: level.id"
      - step: "Write as the configurator group member must succeed"
        action: "write"
        target: "record"
        as_user: "configurator"
        values:
          name: "Configurator Anchor Updated"
      - step: "Assert the write persisted"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Configurator Anchor Updated"
      - step: "Unlink as the configurator group member must succeed"
        action: "unlink"
        target: "record"
        as_user: "configurator"
      - step: "Assert the record is gone"
        action: "search"
        model: "school_character_anchor"
        domain: [["code", "=", "ACL-ANC-POS"]]
        save_as: "gone"
        expect_count: 0

  - name: "Workflow User group alone cannot create, write or unlink a Character Anchor"
    steps:
      - step: "Create the scale"
        action: "create"
        model: "school_character_scale"
        save_as: "scale"
        values:
          name: "ACL Scale ANC2"
          code: "ACL-SCALE-ANC2"
      - step: "Create the level"
        action: "create"
        model: "school_character_level"
        save_as: "level"
        values:
          name: "ACL Level ANC2"
          code: "ACL-LVL-ANC2"
          scale_id: "REC: scale.id"
          sequence: 10
      - step: "Create the construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Construct ANC2"
          code: "ACL-CON-ANC2"
      - step: "Create the Character Anchor Workflow User user"
        action: "create"
        model: "res.users"
        save_as: "workflow_user"
        values:
          name: "Character Anchor Workflow User"
          login: "character_anchor_workflow_user@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_user_group",
                ],
              ],
            ]
      - step: "Create the fixture record as superuser"
        action: "create"
        model: "school_character_anchor"
        save_as: "fixture"
        values:
          name: "Fixture Anchor"
          code: "ACL-ANC-NEG"
          construct_id: "REC: construct.id"
          level_id: "REC: level.id"
      - step: "Create as the workflow User group member must be rejected"
        action: "create"
        model: "school_character_anchor"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Anchor"
          code: "ACL-ANC-BLK"
          construct_id: "REC: construct.id"
          level_id: "REC: level.id"
      - step: "Write as the workflow User group member must be rejected"
        action: "write"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rename"
      - step: "Unlink as the workflow User group member must be rejected"
        action: "unlink"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
      - step: "Read as the workflow User group member still works"
        action: "search"
        model: "school_character_anchor"
        as_user: "workflow_user"
        domain: [["id", "=", "REC: fixture.id"]]
        save_as: "visible"
        expect_count: 1
