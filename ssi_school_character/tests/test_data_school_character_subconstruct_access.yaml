scenarios:
  - name: "Configurator member can create, write and unlink a Character Sub-construct"
    steps:
      - step: "Create the parent construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Construct SUB1"
          code: "ACL-CONSTRUCT-SUB1"
      - step: "Create the Character Sub-construct Configurator user"
        action: "create"
        model: "res.users"
        save_as: "configurator"
        values:
          name: "Character Sub-construct Configurator"
          login: "character_subconstruct_configurator@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_subconstruct_group",
                ],
              ],
            ]
      - step: "Create as the configurator group member must succeed"
        action: "create"
        model: "school_character_subconstruct"
        as_user: "configurator"
        save_as: "record"
        values:
          name: "Configurator Sub-construct"
          code: "ACL-SUB-POS"
          construct_id: "REC: construct.id"
      - step: "Write as the configurator group member must succeed"
        action: "write"
        target: "record"
        as_user: "configurator"
        values:
          name: "Configurator Sub-construct Updated"
      - step: "Assert the write persisted"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Configurator Sub-construct Updated"
      - step: "Unlink as the configurator group member must succeed"
        action: "unlink"
        target: "record"
        as_user: "configurator"
      - step: "Assert the record is gone"
        action: "search"
        model: "school_character_subconstruct"
        domain: [["code", "=", "ACL-SUB-POS"]]
        save_as: "gone"
        expect_count: 0

  - name:
      "Workflow User group alone cannot create, write or unlink a Character
      Sub-construct"
    steps:
      - step: "Create the parent construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "ACL Construct SUB2"
          code: "ACL-CONSTRUCT-SUB2"
      - step: "Create the Character Sub-construct Workflow User user"
        action: "create"
        model: "res.users"
        save_as: "workflow_user"
        values:
          name: "Character Sub-construct Workflow User"
          login: "character_subconstruct_workflow_user@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_user_group",
                ],
              ],
            ]
      - step: "Create the fixture record as superuser"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "fixture"
        values:
          name: "Fixture Sub-construct"
          code: "ACL-SUB-NEG"
          construct_id: "REC: construct.id"
      - step: "Create as the workflow User group member must be rejected"
        action: "create"
        model: "school_character_subconstruct"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Sub-construct"
          code: "ACL-SUB-BLK"
          construct_id: "REC: construct.id"
      - step: "Write as the workflow User group member must be rejected"
        action: "write"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rename"
      - step: "Unlink as the workflow User group member must be rejected"
        action: "unlink"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
      - step: "Read as the workflow User group member still works"
        action: "search"
        model: "school_character_subconstruct"
        as_user: "workflow_user"
        domain: [["id", "=", "REC: fixture.id"]]
        save_as: "visible"
        expect_count: 1
