scenarios:
  - name: "Configurator member can create, write and unlink a Character Scale"
    steps:
      - step: "Create the Character Scale Configurator user"
        action: "create"
        model: "res.users"
        save_as: "configurator"
        values:
          name: "Character Scale Configurator"
          login: "character_scale_configurator@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_scale_group",
                ],
              ],
            ]
      - step: "Create as the configurator group member must succeed"
        action: "create"
        model: "school_character_scale"
        as_user: "configurator"
        save_as: "record"
        values:
          name: "Configurator Scale"
          code: "ACL-SCL-POS"
      - step: "Write as the configurator group member must succeed"
        action: "write"
        target: "record"
        as_user: "configurator"
        values:
          name: "Configurator Scale Updated"
      - step: "Assert the write persisted"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Configurator Scale Updated"
      - step: "Unlink as the configurator group member must succeed"
        action: "unlink"
        target: "record"
        as_user: "configurator"
      - step: "Assert the record is gone"
        action: "search"
        model: "school_character_scale"
        domain: [["code", "=", "ACL-SCL-POS"]]
        save_as: "gone"
        expect_count: 0

  - name: "Workflow User group alone cannot create, write or unlink a Character Scale"
    steps:
      - step: "Create the Character Scale Workflow User user"
        action: "create"
        model: "res.users"
        save_as: "workflow_user"
        values:
          name: "Character Scale Workflow User"
          login: "character_scale_workflow_user@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_character.school_character_user_group",
                ],
              ],
            ]
      - step: "Create the fixture record as superuser"
        action: "create"
        model: "school_character_scale"
        save_as: "fixture"
        values:
          name: "Fixture Scale"
          code: "ACL-SCL-NEG"
      - step: "Create as the workflow User group member must be rejected"
        action: "create"
        model: "school_character_scale"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Scale"
          code: "ACL-SCL-BLK"
      - step: "Write as the workflow User group member must be rejected"
        action: "write"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Rename"
      - step: "Unlink as the workflow User group member must be rejected"
        action: "unlink"
        target: "fixture"
        as_user: "workflow_user"
        expect_error:
          type: "AccessError"
      - step: "Read as the workflow User group member still works"
        action: "search"
        model: "school_character_scale"
        as_user: "workflow_user"
        domain: [["id", "=", "REC: fixture.id"]]
        save_as: "visible"
        expect_count: 1
